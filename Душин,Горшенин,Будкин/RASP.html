<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание занятий</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    background: #03050f;
    color: white;
  }

  /* ─── Фоновая картинка ─── */
  .bg-image {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: url('bg.jpg') center / cover no-repeat fixed;
  }
  .bg-image::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to bottom,
        rgba(2, 5, 25, 0.82) 0%,
        rgba(5, 12, 38, 0.52) 40%,
        rgba(2, 5, 25, 0.88) 100%
      );
  }

  /* ─── Анимированные орбы (ледяная синяя гамма) ─── */
  .bg-orbs {
    position: fixed;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    animation: orbFloat 22s ease-in-out infinite;
  }
  .orb:nth-child(1) {
    width: 620px; height: 620px;
    background: radial-gradient(circle, #1565c0, #0d2b6b);
    top: -180px; left: -180px;
    opacity: 0.30;
    animation-duration: 20s;
  }
  .orb:nth-child(2) {
    width: 480px; height: 480px;
    background: radial-gradient(circle, #4fc3f7, #01579b);
    bottom: -150px; right: -150px;
    opacity: 0.22;
    animation-delay: -8s;
    animation-duration: 25s;
  }
  .orb:nth-child(3) {
    width: 360px; height: 360px;
    background: radial-gradient(circle, #5c35cc, #1a0066);
    top: 40%; left: 52%;
    opacity: 0.18;
    animation-delay: -15s;
    animation-duration: 18s;
  }
  .orb:nth-child(4) {
    width: 280px; height: 280px;
    background: radial-gradient(circle, #b3e5fc, #4fc3f7);
    top: 12%; right: 12%;
    opacity: 0.10;
    animation-delay: -4s;
    animation-duration: 28s;
  }
  @keyframes orbFloat {
    0%,100% { transform: translate(0, 0) scale(1); }
    25%      { transform: translate(40px, -40px) scale(1.08); }
    50%      { transform: translate(-20px, 30px) scale(0.93); }
    75%      { transform: translate(30px, 20px) scale(1.04); }
  }

  /* ─── Мерцающие частицы-искры ─── */
  .sparks {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .spark {
    position: absolute;
    background: rgba(160, 210, 255, 0.9);
    border-radius: 50%;
    animation: sparkPulse ease-in-out infinite;
  }
  /* Круглые точки */
  .spark:nth-child(1)  { width:2px; height:2px; top:8%;  left:18%; animation-duration:6s;  animation-delay:0s;   opacity:.7; }
  .spark:nth-child(2)  { width:3px; height:3px; top:22%; left:72%; animation-duration:9s;  animation-delay:-2s;  opacity:.5; }
  .spark:nth-child(3)  { width:2px; height:2px; top:55%; left:35%; animation-duration:7s;  animation-delay:-4s;  opacity:.8; }
  .spark:nth-child(4)  { width:4px; height:4px; top:78%; left:82%; animation-duration:11s; animation-delay:-6s;  opacity:.4; }
  .spark:nth-child(5)  { width:2px; height:2px; top:18%; left:48%; animation-duration:8s;  animation-delay:-1s;  opacity:.6; }
  .spark:nth-child(6)  { width:3px; height:3px; top:82%; left:28%; animation-duration:10s; animation-delay:-8s;  opacity:.5; }
  .spark:nth-child(7)  { width:2px; height:2px; top:42%; left:8%;  animation-duration:12s; animation-delay:-3s;  opacity:.7; }
  .spark:nth-child(8)  { width:3px; height:3px; top:62%; left:62%; animation-duration:6s;  animation-delay:-5s;  opacity:.4; }
  /* Вертикальные черточки (блики от осколков) */
  .spark:nth-child(9)  { width:1px; height:8px;  top:12%; left:88%; animation-duration:13s; animation-delay:-1s;  opacity:.5; border-radius:1px; background:rgba(200,235,255,0.7); }
  .spark:nth-child(10) { width:1px; height:6px;  top:90%; left:12%; animation-duration:15s; animation-delay:-7s;  opacity:.4; border-radius:1px; background:rgba(200,235,255,0.7); }
  .spark:nth-child(11) { width:1px; height:10px; top:35%; left:95%; animation-duration:10s; animation-delay:-9s;  opacity:.6; border-radius:1px; background:rgba(200,235,255,0.7); }
  .spark:nth-child(12) { width:2px; height:2px; top:48%; left:78%; animation-duration:7s;  animation-delay:-4s;  opacity:.5; }
  @keyframes sparkPulse {
    0%,100% { transform: scale(1)   translateY(0);    opacity: .5; }
    50%      { transform: scale(1.8) translateY(-12px); opacity: 1; }
  }

  /* ─── Все поверх фона ─── */
  .top-bar, .hero, .section-title, .classes-grid, .page-footer {
    position: relative;
    z-index: 2;
  }

  /* ─── Шапка ─── */
  .top-bar {
    background: rgba(2, 8, 35, 0.60);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(79, 195, 247, 0.18);
    padding: 14px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 24px rgba(0, 40, 120, 0.35);
  }
  .top-bar-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;
    color: white;
    text-shadow: 0 0 18px rgba(79, 195, 247, 0.6);
  }
  .top-bar-logo span { font-size: 28px; }
  .top-bar-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .user-badge {
    background: rgba(21, 101, 192, 0.28);
    border: 1px solid rgba(79, 195, 247, 0.35);
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .logout-btn {
    background: rgba(231,76,60,0.25);
    border: 1px solid rgba(231,76,60,0.5);
    color: #ff8a80;
    padding: 7px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .logout-btn:hover {
    background: rgba(231,76,60,0.55);
    color: white;
    transform: translateY(-1px);
  }

  /* ─── Главный блок ─── */
  .hero {
    text-align: center;
    padding: 60px 20px 40px;
  }
  .hero-badge {
    display: inline-block;
    background: rgba(21, 101, 192, 0.18);
    border: 1px solid rgba(79, 195, 247, 0.38);
    color: #90d5f8;
    padding: 6px 20px;
    border-radius: 20px;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 20px;
    box-shadow: 0 0 18px rgba(21, 101, 192, 0.25);
  }
  .hero h1 {
    font-size: clamp(40px, 8vw, 72px);
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff 0%, #90d5f8 35%, #4fc3f7 65%, #7c4dff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 28px rgba(79, 195, 247, 0.35));
  }
  .hero-sub {
    font-size: clamp(18px, 4vw, 28px);
    color: rgba(170, 215, 250, 0.72);
    font-weight: 300;
    margin-bottom: 14px;
  }
  .hero-day {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, #1565c0, #0d47a1);
    padding: 8px 24px;
    border-radius: 20px;
    font-size: 16px;
    font-weight: 600;
    border: 1px solid rgba(79, 195, 247, 0.35);
    box-shadow: 0 4px 24px rgba(21, 101, 192, 0.55),
                0 0 50px rgba(79, 195, 247, 0.15);
  }

  /* ─── Разделитель ─── */
  .section-title {
    text-align: center;
    padding: 10px 20px 30px;
    font-size: 15px;
    color: rgba(144, 213, 248, 0.45);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ─── Сетка классов ─── */
  .classes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
    padding: 0 40px 60px;
    max-width: 1100px;
    margin: 0 auto;
  }

  /* ─── Карточка ─── */
  .class-card {
    border-radius: 20px;
    padding: 30px 20px;
    text-align: center;
    text-decoration: none;
    color: white;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.18);
    animation: cardIn 0.5s ease both;
    background: rgba(255,255,255,0.06);
  }
  .class-card:nth-child(1) { animation-delay: 0.05s; }
  .class-card:nth-child(2) { animation-delay: 0.10s; }
  .class-card:nth-child(3) { animation-delay: 0.15s; }
  .class-card:nth-child(4) { animation-delay: 0.20s; }
  .class-card:nth-child(5) { animation-delay: 0.25s; }
  .class-card:nth-child(6) { animation-delay: 0.30s; }
  .class-card:nth-child(7) { animation-delay: 0.35s; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.9); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .class-card:nth-child(1) { --accent: #667eea; }
  .class-card:nth-child(2) { --accent: #56ccf2; }
  .class-card:nth-child(3) { --accent: #6fcf97; }
  .class-card:nth-child(4) { --accent: #f2c94c; }
  .class-card:nth-child(5) { --accent: #f2994a; }
  .class-card:nth-child(6) { --accent: #eb5757; }
  .class-card:nth-child(7) { --accent: #9b51e0; }

  .card-bg {
    position: absolute;
    inset: -4px;
    background-size: cover;
    background-position: center;
    filter: blur(5px) brightness(0.30) saturate(0.8);
    border-radius: 22px;
    z-index: 0;
    transition: filter 0.35s ease;
  }
  .class-card:hover .card-bg {
    filter: blur(3px) brightness(0.42) saturate(1.1);
  }

  .class-card:nth-child(1) .card-bg { background-image: url('42k.jpeg'); }
  .class-card:nth-child(2) .card-bg { background-image: url('42n.jpg');  }
  .class-card:nth-child(3) .card-bg { background-image: url('42v.jpg');  }
  .class-card:nth-child(4) .card-bg { background-image: url('42j.jpg');  }
  .class-card:nth-child(5) .card-bg { background-image: url('42d.jpg');  }
  .class-card:nth-child(6) .card-bg { background-image: url('42ve.jpg'); }
  .class-card:nth-child(7) .card-bg { background-image: url('42ni.jpg'); }

  .class-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent, #667eea) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.35s;
    border-radius: 20px;
    z-index: 1;
  }
  .class-card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent, #667eea);
    border-radius: 20px 20px 0 0;
    transform: scaleX(0);
    transition: transform 0.35s;
    z-index: 2;
  }
  .class-card:hover {
    transform: translateY(-8px) scale(1.03);
    border-color: rgba(255,255,255,0.35);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5),
                0 0 30px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .class-card:hover::before { opacity: 0.18; }
  .class-card:hover::after  { transform: scaleX(1); }

  .card-content {
    position: relative;
    z-index: 3;
  }
  .class-number {
    font-size: 56px;
    font-weight: 900;
    line-height: 1;
    text-shadow:
      0 0 20px rgba(0,0,0,0.9),
      0 2px 8px rgba(0,0,0,0.8);
    background: linear-gradient(135deg, white, var(--accent, #667eea));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8));
  }
  .class-label {
    font-size: 15px;
    color: rgba(255,255,255,0.9);
    font-weight: 600;
    letter-spacing: 0.5px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.9);
  }
  .class-arrow {
    margin-top: 12px;
    font-size: 20px;
    opacity: 0;
    transform: translateX(-5px);
    transition: all 0.3s;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  .class-card:hover .class-arrow {
    opacity: 1;
    transform: translateX(0);
  }

  /* ─── Подвал ─── */
  .page-footer {
    text-align: center;
    padding: 24px;
    background: rgba(2, 8, 35, 0.55);
    border-top: 1px solid rgba(79, 195, 247, 0.10);
    font-size: 13px;
    color: rgba(144, 213, 248, 0.35);
    position: relative;
    z-index: 2;
  }

  /* ─── Адаптивность ─── */
  @media (max-width: 600px) {
    .classes-grid { padding: 0 20px 40px; gap: 14px; }
    .top-bar { padding: 12px 16px; }
    .top-bar-logo { font-size: 15px; }
    .hero { padding: 40px 16px 30px; }
  }
  @media (max-width: 400px) {
    .classes-grid { grid-template-columns: repeat(2, 1fr); }
    .user-badge .user-name { display: none; }
  }
</style>
</head>
<body>

<footer class="page-footer">

<script>
  if (sessionStorage.getItem('isLoggedIn') !== 'true') {
    window.location.href = 'auth.html';
  }

  const username = sessionStorage.getItem('username') || 'Гость';
  document.getElementById('usernameDisplay').textContent = username;

  function logout() {
    if (confirm('Вы уверены, что хотите выйти?')) {
      sessionStorage.removeItem('isLoggedIn');
      sessionStorage.removeItem('username');
      window.location.href = 'auth.html';
