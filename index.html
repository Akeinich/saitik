<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Электронный Дневник — Школьный Портал">
  <title>Электронный Дневник — Вход</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword,
      updateProfile,
      onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import { 
      getDatabase, 
      ref, 
      set,
      update
    } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

    const firebaseConfig = {
      apiKey: "AIzaSyA_rAWj8YakdcZ-WBvQAGNVD1jTGvUFUaQ",
      authDomain: "sait-8a1d6.firebaseapp.com",
      databaseURL: "https://sait-8a1d6-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "sait-8a1d6",
      storageBucket: "sait-8a1d6.firebasestorage.app",
      messagingSenderId: "471741162305",
      appId: "1:471741162305:web:e0597664c362b91fc8b7c0"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getDatabase(app);

    // Экспортируем функции в window — к ним обращается обычный скрипт ниже
    window._firebase = {
      signIn:         (e, p) => signInWithEmailAndPassword(auth, e, p),
      createUser:     (e, p) => createUserWithEmailAndPassword(auth, e, p),
      updateProfile:  (u, d) => updateProfile(u, d),
      dbSet:          (path, data) => set(ref(db, path), data),
      dbUpdate:       (path, data) => update(ref(db, path), data),
    };

    // Если пользователь уже авторизован — можно добавить авто-редирект
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // window.location.href = 'RASP.HTML'; // раскомментируй по желанию
      }
    });
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #c0392b; --red-hot: #ff2233; --red-glow: #ff000088;
      --gold: #c9a84c; --dark2: #110508; --text: #e8d5c4;
    }
    body {
      min-height: 100vh; background: var(--dark2);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Rajdhani', sans-serif; overflow: hidden; position: relative;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 50%, #2a000888 0%, transparent 70%),
        radial-gradient(ellipse 100% 80% at 50% 100%, #1a000488 0%, transparent 60%);
      animation: bgPulse 4s ease-in-out infinite alternate; pointer-events: none;
    }
    @keyframes bgPulse { from{opacity:.7} to{opacity:1} }
    #particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .pentagram-bg {
      position: fixed; width: 700px; height: 700px;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      opacity: .04; animation: rotateSlow 60s linear infinite;
      pointer-events: none; z-index: 0;
    }
    @keyframes rotateSlow { to { transform: translate(-50%,-50%) rotate(360deg); } }

    .card {
      position: relative; z-index: 10; width: 440px; padding: 46px 44px 40px;
      background: linear-gradient(160deg, #12020588 0%, #0a0a0a99 100%);
      border: 1px solid #3a0a0a; backdrop-filter: blur(18px);
      box-shadow: 0 0 0 1px #ff223311, 0 0 40px #ff000033, 0 0 100px #c0392b22, inset 0 1px 0 #ffffff08;
      animation: cardAppear .8s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes cardAppear { from{opacity:0;transform:translateY(30px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }
    .card::before, .card::after { content:''; position:absolute; width:22px; height:22px; border-color:var(--red); border-style:solid; }
    .card::before { top:-1px; left:-1px; border-width:2px 0 0 2px; }
    .card::after  { bottom:-1px; right:-1px; border-width:0 2px 2px 0; }
    .corner-tr, .corner-bl { position:absolute; width:22px; height:22px; border-color:var(--red); border-style:solid; }
    .corner-tr { top:-1px; right:-1px; border-width:2px 2px 0 0; }
    .corner-bl { bottom:-1px; left:-1px; border-width:0 0 2px 2px; }

    .logo-wrap { text-align:center; margin-bottom:24px; }
    .logo-icon { width:68px; height:68px; margin:0 auto 12px; }
    .logo-icon svg { width:100%; height:100%; filter:drop-shadow(0 0 12px var(--red-hot)); }
    .logo-title { font-family:'Cinzel Decorative',serif; font-size:17px; letter-spacing:3px; text-transform:uppercase; color:#fff; text-shadow:0 0 20px var(--red-hot),0 0 40px var(--red); line-height:1.3; }
    .logo-sub   { font-family:'Cinzel Decorative',serif; font-size:9px; letter-spacing:6px; color:var(--gold); text-shadow:0 0 10px #c9a84c88; margin-top:4px; }

    .tabs { display:flex; margin-bottom:20px; border-bottom:1px solid #3a0a0a; }
    .tab-btn { flex:1; padding:10px; background:none; border:none; font-family:'Rajdhani',sans-serif; font-size:11px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:#5a3535; cursor:pointer; position:relative; transition:color .3s; }
    .tab-btn::after { content:''; position:absolute; bottom:-1px; left:0; right:0; height:2px; background:var(--red); transform:scaleX(0); transition:transform .3s cubic-bezier(.34,1.56,.64,1); }
    .tab-btn.active { color:var(--red); text-shadow:0 0 8px var(--red-glow); }
    .tab-btn.active::after { transform:scaleX(1); }
    .tab-btn:hover:not(.active) { color:#8a4040; }

    .divider { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
    .divider span { flex:1; height:1px; background:linear-gradient(90deg,transparent,#c0392b66,transparent); }
    .divider i { color:var(--red); font-size:16px; }

    .alert { padding:10px 16px; border-radius:3px; font-size:12px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:16px; display:none; animation:fadeInUp .3s ease both; }
    .alert.error   { background:rgba(192,57,43,.2); border:1px solid #c0392b66; color:#ff8a80; display:block; }
    .alert.success { background:rgba(46,125,50,.2);  border:1px solid #2e7d3266; color:#a5d6a7;  display:block; }

    .form-panel { display:none; }
    .form-panel.active { display:block; animation:fadeInUp .35s ease both; }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

    .form-group { margin-bottom:18px; position:relative; }
    .form-label { display:block; font-size:11px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:var(--red); margin-bottom:8px; text-shadow:0 0 8px var(--red-glow); }
    .form-input { width:100%; padding:12px 18px 12px 46px; background:#0e020288; border:1px solid #3a0a0a; border-radius:3px; color:var(--text); font-family:'Rajdhani',sans-serif; font-size:16px; font-weight:600; letter-spacing:1px; outline:none; transition:border-color .3s, box-shadow .3s, background .3s; }
    .form-input::placeholder { color:#5a3535; letter-spacing:1px; }
    .form-input:focus { border-color:var(--red); background:#1a030388; box-shadow:0 0 0 2px #ff223322, 0 0 20px #ff000022, inset 0 0 10px #ff000011; }
    .input-icon { position:absolute; left:16px; bottom:12px; color:#5a2020; font-size:17px; transition:color .3s; pointer-events:none; }
    .form-group:focus-within .input-icon { color:var(--red); }

    .options { display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; }
    .checkbox-wrap { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
    .checkbox-wrap input { display:none; }
    .custom-check { width:16px; height:16px; border:1px solid #3a0a0a; background:#0e0202; position:relative; transition:border-color .3s; }
    .checkbox-wrap:hover .custom-check { border-color:var(--red); }
    .checkbox-wrap input:checked + .custom-check { border-color:var(--red); background:var(--red); }
    .checkbox-wrap input:checked + .custom-check::after { content:''; position:absolute; top:2px; left:5px; width:5px; height:9px; border:2px solid #fff; border-top:none; border-left:none; transform:rotate(45deg); }
    .check-label { font-size:12px; font-weight:600; letter-spacing:1.5px; color:#8a4040; text-transform:uppercase; }
    .forgot-link { font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--gold); text-decoration:none; transition:color .3s, text-shadow .3s; }
    .forgot-link:hover { color:#f0cc70; text-shadow:0 0 10px #c9a84c; }

    .btn-submit { width:100%; padding:14px; background:linear-gradient(135deg,#8b0000 0%,#c0392b 50%,#8b0000 100%); background-size:200% 100%; border:1px solid #ff223355; border-radius:3px; color:#fff; font-family:'Cinzel Decorative',serif; font-size:12px; letter-spacing:3px; text-transform:uppercase; cursor:pointer; position:relative; overflow:hidden; transition:background-position .4s, box-shadow .4s, transform .15s; box-shadow:0 0 20px #c0392b55, 0 4px 15px #00000088; }
    .btn-submit::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,transparent 30%,#ffffff18 50%,transparent 70%); transform:translateX(-100%); transition:transform .5s; }
    .btn-submit:hover { background-position:100% 0; box-shadow:0 0 30px #ff223366,0 0 60px #c0392b44,0 4px 20px #00000099; }
    .btn-submit:hover::before { transform:translateX(100%); }
    .btn-submit:active { transform:scale(.98); }
    .btn-submit:disabled { opacity:.5; cursor:not-allowed; }
    .btn-text { position:relative; display:inline-block; }
    .btn-submit:hover .btn-text::before { color:var(--red-hot); animation:glitch1 .3s steps(1) infinite; clip-path:polygon(0 0,100% 0,100% 45%,0 45%); }
    .btn-submit:hover .btn-text::after  { color:#00ffff44;    animation:glitch2 .3s steps(1) infinite; clip-path:polygon(0 55%,100% 55%,100% 100%,0 100%); }
    @keyframes glitch1 { 0%{transform:translate(0)} 33%{transform:translate(-2px,1px)} 66%{transform:translate(2px,-1px)} 100%{transform:translate(0)} }
    @keyframes glitch2 { 0%{transform:translate(0)} 33%{transform:translate(2px,-1px)} 66%{transform:translate(-2px,1px)} 100%{transform:translate(0)} }

    .card-footer { margin-top:20px; text-align:center; font-size:12px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:#5a3535; }
    .card-footer a { color:var(--red); text-decoration:none; transition:color .3s,text-shadow .3s; }
    .card-footer a:hover { color:var(--red-hot); text-shadow:0 0 8px var(--red-hot); }

    .spinner { display:inline-block; width:14px; height:14px; border:2px solid #ffffff44; border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:8px; }
    @keyframes spin { to{transform:rotate(360deg)} }

    .scanlines { position:fixed; inset:0; background:repeating-linear-gradient(to bottom,transparent 0px,transparent 3px,#00000012 3px,#00000012 4px); pointer-events:none; z-index:100; animation:scanMove 8s linear infinite; }
    @keyframes scanMove { to{background-position:0 100px} }
    .blood-drips { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-around; pointer-events:none; z-index:1; }
    .drip { width:3px; background:linear-gradient(to bottom,var(--red),transparent); animation:drip linear infinite; border-radius:0 0 3px 3px; opacity:.6; }
    @keyframes drip { 0%{height:0;opacity:.6} 80%{opacity:.4} 100%{height:120px;opacity:0} }
    .watermark { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); font-size:10px; letter-spacing:4px; text-transform:uppercase; color:#3a1515; z-index:5; white-space:nowrap; }
    @media (max-width:480px) { .card{width:95vw;padding:36px 24px 32px} .logo-title{font-size:14px;letter-spacing:2px} }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <svg class="pentagram-bg" viewBox="0 0 100 100">
    <path d="M50 5 L61 40 L98 40 L68 62 L79 97 L50 75 L21 97 L32 62 L2 40 L39 40 Z" fill="#c0392b"/>
  </svg>
  <div class="scanlines"></div>
  <div class="blood-drips" id="drips"></div>
  <div class="watermark">© 2025-2026 Электронный Дневник</div>

  <div class="card">
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>

    <div class="logo-wrap">
      <div class="logo-icon">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="45" fill="none" stroke="#c0392b" stroke-width="2"/>
          <path d="M50 15 L50 85 M15 50 L85 50 M25 25 L75 75 M25 75 L75 25" stroke="#ff2233" stroke-width="1.5"/>
          <circle cx="50" cy="50" r="15" fill="#c9a84c" opacity="0.6"/>
        </svg>
      </div>
      <h1 class="logo-title">Электронный Дневник</h1>
      <p class="logo-sub">Школьный Портал</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')" type="button">⚔ Вход</button>
      <button class="tab-btn" onclick="switchTab('register')" type="button">✦ Регистрация</button>
    </div>

    <div id="alertBox" class="alert"></div>

    <!-- LOGIN -->
    <div id="loginPanel" class="form-panel active">
      <div class="divider"><span></span><i>✦</i><span></span></div>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="loginEmail">E-mail</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="ученик@школа.ru" autocomplete="email" required>
          <span class="input-icon">✉</span>
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">Пароль</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
          <span class="input-icon">🔑</span>
        </div>
        <div class="options">
          <label class="checkbox-wrap">
            <input type="checkbox" id="rememberMe">
            <span class="custom-check"></span>
            <span class="check-label">Запомнить</span>
          </label>
          <a href="backup.html" class="forgot-link">Забыли пароль?</a>
        </div>
        <button type="submit" id="loginBtn" class="btn-submit">
          <span class="btn-text" data-text="Войти в Систему">Войти в Систему</span>
        </button>
      </form>
      <div class="card-footer">
        Нет аккаунта? <a href="#" onclick="switchTab('register'); return false;">Зарегистрироваться</a>
      </div>
    </div>

    <!-- REGISTER -->
    <div id="registerPanel" class="form-panel">
      <div class="divider"><span></span><i>⚔</i><span></span></div>
      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label" for="regUsername">Имя Ученика</label>
          <input type="text" id="regUsername" class="form-input" placeholder="Иван Иванов" autocomplete="name" required>
          <span class="input-icon">👤</span>
        </div>
        <div class="form-group">
          <label class="form-label" for="regEmail">E-mail</label>
          <input type="email" id="regEmail" class="form-input" placeholder="ученик@школа.ru" autocomplete="email" required>
          <span class="input-icon">✉</span>
        </div>
        <div class="form-group">
          <label class="form-label" for="regPassword">Пароль</label>
          <input type="password" id="regPassword" class="form-input" placeholder="••••••••" autocomplete="new-password" minlength="6" required>
          <span class="input-icon">🔑</span>
        </div>
        <div class="form-group">
          <label class="form-label" for="regConfirm">Подтверждение</label>
          <input type="password" id="regConfirm" class="form-input" placeholder="••••••••" autocomplete="new-password" minlength="6" required>
          <span class="input-icon">🔒</span>
        </div>
        <button type="submit" id="regBtn" class="btn-submit">
          <span class="btn-text" data-text="Записаться">Записаться</span>
        </button>
      </form>
      <div class="card-footer">
        Уже есть аккаунт? <a href="#" onclick="switchTab('login'); return false;">Войти</a>
      </div>
    </div>
  </div>

  <script>
    /* ── BLOOD DRIPS ── */
    (function(){
      const w = document.getElementById('drips');
      for(let i=0;i<20;i++){
        const d=document.createElement('div'); d.className='drip';
        d.style.cssText=`margin-left:${Math.random()*100}%;animation-duration:${3+Math.random()*6}s;animation-delay:${Math.random()*8}s;opacity:${0.2+Math.random()*0.5};width:${1+Math.random()*3}px;`;
        w.appendChild(d);
      }
    })();

    /* ── PARTICLES ── */
    (function(){
      const cv=document.getElementById('particles'), cx=cv.getContext('2d');
      let W,H,ps=[];
      function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
      addEventListener('resize',resize); resize();
      function rand(a,b){return a+Math.random()*(b-a);}
      for(let i=0;i<70;i++) ps.push({x:rand(0,W),y:rand(0,H),vx:rand(-.3,.3),vy:rand(-1,-.1),sz:rand(1,3),al:rand(.1,.6),col:Math.random()>.7?`rgba(${~~rand(180,255)},${~~rand(0,30)},${~~rand(0,30)},`:`rgba(${~~rand(160,210)},${~~rand(60,100)},${~~rand(0,20)},`});
      function draw(){
        cx.clearRect(0,0,W,H);
        ps.forEach(p=>{
          p.x+=p.vx;p.y+=p.vy;p.al-=.001;
          if(p.y<-10||p.al<=0){p.x=rand(0,W);p.y=H+5;p.al=rand(.2,.7);}
          cx.beginPath();cx.arc(p.x,p.y,p.sz,0,Math.PI*2);cx.fillStyle=p.col+p.al+')';cx.fill();
          cx.beginPath();cx.arc(p.x,p.y,p.sz*2.5,0,Math.PI*2);
          const g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.sz*2.5);
          g.addColorStop(0,p.col+(p.al*.4)+')');g.addColorStop(1,'transparent');
          cx.fillStyle=g;cx.fill();
        });
        requestAnimationFrame(draw);
      }
      draw();
    })();

    /* ── TABS ── */
    function switchTab(tab) {
      const l = tab==='login';
      document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',l?i===0:i===1));
      document.getElementById('loginPanel').classList.toggle('active', l);
      document.getElementById('registerPanel').classList.toggle('active', !l);
      hideAlert();
    }

    /* ── ALERTS ── */
    function showAlert(msg, type) {
      const el = document.getElementById('alertBox');
      el.textContent = msg; el.className = 'alert ' + type;
    }
    function hideAlert() { document.getElementById('alertBox').className = 'alert'; }

    /* ── КНОПКА ── */
    function setBtnLoading(btn, text) {
      btn.disabled = true;
      btn.querySelector('.btn-text').innerHTML = `<span class="spinner"></span>${text}`;
    }
    function setBtnSuccess(btn, text) {
      btn.style.background = 'linear-gradient(135deg,#1a4a1a,#2d8b2d,#1a4a1a)';
      btn.style.boxShadow  = '0 0 30px #00ff0044';
      btn.querySelector('.btn-text').textContent = text;
    }
    function resetBtn(btn, text) {
      btn.disabled = false; btn.style.background = ''; btn.style.boxShadow = '';
      btn.querySelector('.btn-text').innerHTML = text;
      btn.querySelector('.btn-text').setAttribute('data-text', text);
    }

    /* ── ЖДЁМ ИНИЦИАЛИЗАЦИИ FIREBASE (module загружается асинхронно) ── */
    function ready(cb, n = 0) {
      if (window._firebase) { cb(); }
      else if (n < 60) { setTimeout(() => ready(cb, n+1), 100); }
      else { showAlert('⚠ Нет соединения с сервером. Обновите страницу.', 'error'); }
    }

    /* ── LOGIN ── */
    async function handleLogin(e) {
      e.preventDefault(); hideAlert();
      ready(async () => {
        const email    = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const remember = document.getElementById('rememberMe').checked;
        const btn      = document.getElementById('loginBtn');
        setBtnLoading(btn, 'Проверка...');
        try {
          const { user } = await window._firebase.signIn(email, password);

          // displayName может быть null если аккаунт создавали не через этот сайт
          const username = user.displayName || email.split('@')[0];

          /* ═══ ИСПРАВЛЕНИЕ БАГ 1 ═══
             Добавлен 'username' — все остальные страницы читают именно его */
          sessionStorage.setItem('isLoggedIn', 'true');
          sessionStorage.setItem('userId',    user.uid);
          sessionStorage.setItem('userEmail', user.email);
          sessionStorage.setItem('username',  username);   // ← ДОБАВЛЕНО

          if (remember) localStorage.setItem('school_remembered', email);

          // Обновляем lastLogin (не критично, ошибку глушим)
          window._firebase.dbUpdate('users/' + user.uid, { lastLogin: Date.now() }).catch(()=>{});

          setBtnSuccess(btn, 'Добро пожаловать!');
          /* ═══ ИСПРАВЛЕНИЕ БАГ 3 ═══ */
          setTimeout(() => { window.location.href = 'RASP.HTML'; }, 800); // ← ЗАГЛАВНЫЕ

        } catch (err) {
          let msg = '⚠ Ошибка входа.';
          switch (err.code) {
            case 'auth/invalid-credential':   // Firebase 10+ объединяет not-found + wrong-password
            case 'auth/user-not-found':        msg = '⚠ Неверный email или пароль.'; break;
            case 'auth/wrong-password':        msg = '⚠ Неверный пароль.'; break;
            case 'auth/invalid-email':         msg = '⚠ Неверный формат email.'; break;
            case 'auth/user-disabled':         msg = '⚠ Аккаунт заблокирован.'; break;
            case 'auth/too-many-requests':     msg = '⚠ Слишком много попыток. Попробуйте позже.'; break;
            case 'auth/network-request-failed':msg = '⚠ Ошибка сети. Проверьте подключение.'; break;
          }
          showAlert(msg, 'error');
          resetBtn(btn, 'Войти в Систему');
        }
      });
    }

    /* ── REGISTER ── */
    async function handleRegister(e) {
      e.preventDefault(); hideAlert();
      ready(async () => {
        const username = document.getElementById('regUsername').value.trim();
        const email    = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirm  = document.getElementById('regConfirm').value;
        const btn      = document.getElementById('regBtn');

        if (username.length < 2) { showAlert('⚠ Имя — минимум 2 символа.', 'error'); return; }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showAlert('⚠ Введите корректный e-mail.', 'error'); return; }
        if (password.length < 6) { showAlert('⚠ Пароль — минимум 6 символов.', 'error'); return; }
        if (password !== confirm) { showAlert('⚠ Пароли не совпадают.', 'error'); return; }

        setBtnLoading(btn, 'Создание аккаунта...');
        try {
          const { user } = await window._firebase.createUser(email, password);
          await window._firebase.updateProfile(user, { displayName: username });

          /* ═══ ИСПРАВЛЕНИЕ БАГ 2 ═══
             Добавлен role: 'student' — без него admin-панель и чат не видят роль
             Путь users/{uid} — правильный для Firebase Auth */
          await window._firebase.dbSet('users/' + user.uid, {
            username:  username,
            email:     email,
            role:      'student',   // ← ДОБАВЛЕНО
            createdAt: Date.now(),
            lastLogin: Date.now()
          });

          /* ═══ ИСПРАВЛЕНИЕ БАГ 1 ═══ */
          sessionStorage.setItem('isLoggedIn', 'true');
          sessionStorage.setItem('userId',    user.uid);
          sessionStorage.setItem('userEmail', user.email);
          sessionStorage.setItem('username',  username);  // ← ДОБАВЛЕНО

          setBtnSuccess(btn, 'Аккаунт создан!');
          /* ═══ ИСПРАВЛЕНИЕ БАГ 3 ═══ */
          setTimeout(() => { window.location.href = 'RASP.HTML'; }, 800); // ← ЗАГЛАВНЫЕ

        } catch (err) {
          let msg = '⚠ Ошибка регистрации.';
          switch (err.code) {
            case 'auth/email-already-in-use': msg = '⚠ Этот email уже зарегистрирован.'; break;
            case 'auth/invalid-email':        msg = '⚠ Неверный формат email.'; break;
            case 'auth/weak-password':        msg = '⚠ Пароль слишком слабый (минимум 6 символов).'; break;
            case 'auth/network-request-failed': msg = '⚠ Ошибка сети. Проверьте подключение.'; break;
          }
          showAlert(msg, 'error');
          resetBtn(btn, 'Записаться');
        }
      });
    }

    /* ── AUTO-FILL ── */
    (function(){
      const saved = localStorage.getItem('school_remembered');
      if (saved) { document.getElementById('loginEmail').value = saved; document.getElementById('rememberMe').checked = true; }
    })();
  </script>
